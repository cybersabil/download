<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberSabil Public Downloads</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--line:#d9dde3;--text:#20242a;--muted:#6f7782;
  --accent:#2f6fed;--accent2:#174ea6;--hover:#edf3ff
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text)
}

/* Exactly one ultra-compact top strip, no blank margin above */
.topbar{
  margin:0;
  padding:0 5px;
  height:5mm;
  min-height:5mm;
  max-height:5mm;
  display:flex;
  align-items:center;
  gap:5px;
  overflow:hidden;
  background:#2c2f33;
  color:#fff;
  border-bottom:1px solid #202327
}
.brand{
  font-size:10px;
  line-height:1;
  font-weight:750;
  white-space:nowrap
}
.path{
  display:flex;
  align-items:center;
  gap:1px;
  min-width:0;
  flex:1 1 auto;
  overflow:hidden;
  white-space:nowrap
}
.crumb{
  border:0;
  background:transparent;
  color:#fff;
  border-radius:3px;
  padding:1px 3px;
  cursor:pointer;
  font-size:10px;
  line-height:1;
  font-weight:650;
  white-space:nowrap
}
.crumb:hover{background:#3b4046}
.sep{color:#aeb4bb;font-size:9px;line-height:1}
.btn{
  border:1px solid #555a60;
  background:#3a3e43;
  color:#fff;
  border-radius:3px;
  height:4mm;
  min-height:4mm;
  padding:0 4px;
  cursor:pointer;
  font-size:9px;
  line-height:1;
  font-weight:650;
  white-space:nowrap
}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Keep search logic available but remove its visual row */
.search{display:none}

.content{padding:5px 6px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
  gap:4px
}
.item{
  min-height:112px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:5px 3px 4px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent
}
.item.folder{cursor:pointer}
.item:hover{background:var(--hover);border-color:#dbe7ff}
.icon{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  line-height:1
}
.name{
  margin-top:3px;
  width:100%;
  text-align:center;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
  overflow-wrap:anywhere
}
.sub{
  margin-top:1px;
  width:100%;
  text-align:center;
  font-size:9px;
  color:var(--muted)
}
.actions{
  display:flex;
  gap:3px;
  justify-content:center;
  flex-wrap:nowrap;
  margin-top:4px
}
.action{
  text-decoration:none;
  font-size:9px;
  font-weight:750;
  color:var(--accent);
  border:1px solid #cbdcff;
  background:#fff;
  padding:2px 5px;
  border-radius:4px;
  cursor:pointer
}
.action:hover{background:#f7faff;color:var(--accent2)}
.action.secondary{color:#505761;border-color:#d7dbe1}

.list.grid{
  display:block;
  border:1px solid var(--line);
  border-radius:9px;
  overflow:hidden;
  background:#fff
}
.list .item{
  min-height:auto;
  display:grid;
  grid-template-columns:32px minmax(150px,1fr) 75px 135px 155px;
  align-items:center;
  gap:6px;
  padding:4px 7px;
  border-radius:0;
  border:0;
  border-bottom:1px solid #eceff3
}
.list .item:last-child{border-bottom:0}
.list .icon{height:auto;font-size:22px;justify-content:flex-start}
.list .name,.list .sub{text-align:left;margin:0}
.list .actions{margin:0;justify-content:flex-start}

.empty,.error{
  max-width:720px;
  margin:20px auto;
  text-align:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px
}
.loading{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100px;
  color:var(--muted);
  font-weight:650
}

@media(max-width:760px){
  .topbar{padding:0 3px;gap:3px}
  .brand{font-size:9px}
  .crumb{font-size:9px;padding:1px 2px}
  .btn{font-size:8px;padding:0 3px}
  .content{padding:4px 5px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:3px}
  .item{min-height:108px}
  .list .item{grid-template-columns:38px 1fr 95px}
  .list .item .modified,.list .item .actions{display:none}
}

/* Maximum-density file grid */

.item{max-width:140px;justify-self:stretch}
.name{min-height:0}
.sub{line-height:1.05}
.actions{width:100%;align-items:center}
.action{line-height:1.05;white-space:nowrap}

.grid{
  grid-template-columns:repeat(auto-fill,minmax(82px,1fr));
  gap:2px;
}
.item{
  min-height:78px;
  max-width:none;
  padding:3px 2px 3px;
  border-radius:4px;
}
.icon{
  height:32px;
  font-size:28px;
}
.name{
  margin-top:1px;
  font-size:10px;
  line-height:1.05;
  max-height:22px;
  overflow:hidden;
}
.grid .sub{display:none}
.actions{
  gap:2px;
  margin-top:2px;
  flex-wrap:nowrap;
}
.action{
  font-size:8px;
  line-height:1;
  padding:1px 3px;
  border-radius:3px;
  min-height:15px;
}
.list .sub{display:block}
.list .item{
  min-height:30px;
  grid-template-columns:28px minmax(150px,1fr) 65px 120px 120px;
  gap:4px;
  padding:3px 6px;
}
.list .icon{font-size:18px}
.list .name{font-size:10px;max-height:none}
.list .action{font-size:8px;padding:1px 3px}
@media(min-width:1200px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:2px}
  .item{min-height:76px}

  --card-shadow:0 2px 8px rgba(15,23,42,.06), 0 10px 28px rgba(15,23,42,.06);
  --card-shadow-hover:0 4px 12px rgba(15,23,42,.08), 0 16px 36px rgba(37,99,235,.10);
  --text-strong:#0f172a;
  --text-mid:#475569;
  --line-soft:#e8eef7;
  --blue-1:#4f8dfd;
  --blue-2:#2563eb;
  --gold-1:#f8b548;
  --gold-2:#f59e0b;
  --header-1:#0f172a;
  --header-2:#172554;
}

/* Rich page background */
body{
  background:
    radial-gradient(circle at top left, rgba(79,141,253,.18) 0, rgba(79,141,253,0) 28%),
    radial-gradient(circle at top right, rgba(248,181,72,.16) 0, rgba(248,181,72,0) 26%),
    linear-gradient(180deg, var(--page-bg-1) 0%, var(--page-bg-2) 48%, var(--page-bg-3) 100%) !important;
  color:var(--text-strong) !important;
}

/* Premium dark top bar */
.topbar{
  background:
    linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 100%),
    linear-gradient(135deg, var(--header-1) 0%, #172554 52%, #1e3a8a 100%) !important;
  border-bottom:1px solid rgba(255,255,255,.08) !important;
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 10px 24px rgba(15,23,42,.18) !important;
}
.brand{
  color:#ffffff !important;
  font-weight:700 !important;
  letter-spacing:.18px !important;
  text-shadow:0 1px 0 rgba(0,0,0,.2);
}
.path{gap:2px !important}
.crumb{
  color:#eff6ff !important;
  border-radius:4px !important;
  padding:1px 5px !important;
  font-weight:600 !important;
}
.crumb:hover{
  background:rgba(255,255,255,.12) !important;
}
.sep{
  color:rgba(255,255,255,.55) !important;
}

/* Top controls */
.btn{
  background:linear-gradient(180deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.06) 100%) !important;
  border:1px solid rgba(255,255,255,.16) !important;
  color:#ffffff !important;
  border-radius:5px !important;
  box-shadow:
    0 1px 0 rgba(255,255,255,.08) inset,
    0 1px 2px rgba(0,0,0,.14) !important;
}
.btn:hover{
  background:linear-gradient(180deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.10) 100%) !important;
}

/* Content spacing */
.content{
  padding:8px 10px !important;
}

/* Rich premium cards */
.grid{
  gap:6px !important;
  background:transparent !important;
  border:0 !important;
}
.item{
  background:var(--card-bg) !important;
  border:1px solid var(--card-border) !important;
  box-shadow:var(--card-shadow) !important;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-radius:8px !important;
  overflow:hidden;
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease,
    background .18s ease !important;
}
.item:hover{
  transform:translateY(-1px);
  border-color:var(--card-border-hover) !important;
  box-shadow:var(--card-shadow-hover) !important;
  background:#ffffff !important;
}
.icon{
  position:relative;
}
.icon::before{
  content:"";
  position:absolute;
  inset:0 10%;
  border-radius:8px;
  background:
    linear-gradient(180deg, rgba(79,141,253,.08), rgba(79,141,253,0)),
    linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0));
  pointer-events:none;
}
.name{
  color:var(--text-strong) !important;
  font-weight:600 !important;
  letter-spacing:.04px !important;
}
.sub{
  color:var(--text-mid) !important;
}

/* Premium action row */
.actions{
  margin-top:auto !important;
  gap:2px !important;
  padding:0 1px 1px 1px !important;
}
.action{
  font-size:10px !important;
  font-weight:600 !important;
  border-radius:3px !important;
  min-height:16px !important;
  height:16px !important;
  line-height:16px !important;
  padding:0 4px !important;
  box-shadow:
    0 1px 0 rgba(255,255,255,.25) inset,
    0 1px 2px rgba(15,23,42,.08) !important;
  transition:
    transform .14s ease,
    filter .14s ease,
    box-shadow .14s ease !important;
}
.action:hover{
  transform:translateY(-.5px);
  filter:brightness(.99);
  box-shadow:
    0 1px 0 rgba(255,255,255,.24) inset,
    0 2px 5px rgba(15,23,42,.12) !important;
}
.action.secondary{
  background:linear-gradient(180deg,#ffffff 0%, #f5f8fc 100%) !important;
  color:#0f172a !important;
  border:1px solid #d3deec !important;
}
.item.folder .action:not(.secondary){
  background:linear-gradient(180deg, var(--blue-1) 0%, var(--blue-2) 100%) !important;

.item:not(.folder) .action:not(.secondary){

  color:#ffffff !important;
  border:1px solid #d88700 !important;

/* Make list view premium too */
.list.grid{
  background:rgba(255,255,255,.94) !important;
  border:1px solid var(--card-border) !important;
  border-radius:10px !important;
  box-shadow:var(--card-shadow) !important;
}
.list .item{

  border-bottom:1px solid var(--line-soft) !important;

}
.list .item:last-child{
  border-bottom:0 !important;
}

/* Empty/error state refinement */
.empty,.error{
  background:rgba(255,255,255,.94) !important;
  border:1px solid var(--card-border) !important;
  box-shadow:var(--card-shadow) !important;
  color:var(--text-strong) !important;
}
.loading{
  color:#334155 !important;
}

  .content{padding:7px 8px !important}

<body>

<header class="topbar">
  <div class="brand">CyberSabil Public Files</div>
  <div class="path" id="breadcrumbs"></div>
  <input id="search" class="search" type="search" placeholder="Search…" autocomplete="off">
  <button class="btn" id="backBtn" type="button">← Back</button>
  <button class="btn" id="refreshBtn" type="button">↻ Refresh</button>
  <button class="btn" id="viewBtn" type="button">▦ Grid</button>
</header>

<main class="content">
  <div id="main" class="loading">Loading files…</div>
</main>

<script>
(() => {
"use strict";

const API_BASE = "https://cybersabil-download.xubi.org/";
const FILE_DOWNLOAD_BASE = API_BASE + "download-file/";
const FOLDER_DOWNLOAD_BASE = API_BASE + "download-folder/";

const state = {
  path: [],
  items: [],
  view: localStorage.getItem("cybersabil-download-view") || "grid",
  loading: false
};

const $ = id => document.getElementById(id);
const main = $("main");
const search = $("search");
const breadcrumbs = $("breadcrumbs");
const backBtn = $("backBtn");
const refreshBtn = $("refreshBtn");
const viewBtn = $("viewBtn");

function cleanDirName(name) {
  return String(name || "").replace(/\/+$/g, "");
}

function encodePath(parts) {
  return parts
    .map(p => cleanDirName(p))
    .filter(Boolean)
    .map(p => encodeURIComponent(p))
    .join("/");
}

function currentApiUrl() {
  const p = encodePath(state.path);
  return API_BASE + (p ? p + "/" : "");
}

function fileOpenUrl(name) {
  return API_BASE + encodePath([...state.path, name]);
}

function fileDownloadUrl(name) {
  return FILE_DOWNLOAD_BASE + encodePath([...state.path, name]);
}

function folderDownloadUrl(name) {
  return FOLDER_DOWNLOAD_BASE + encodePath([...state.path, cleanDirName(name)]);
}

function formatBytes(bytes) {
  const n = Number(bytes || 0);
  if (n < 1024) return n + " B";
  const units = ["KB","MB","GB","TB"];
  let value = n, i = -1;
  do { value /= 1024; i++; } while (value >= 1024 && i < units.length - 1);
  return (value >= 10 ? value.toFixed(1) : value.toFixed(2)).replace(/\.00$/,"") + " " + units[i];
}

function formatDate(v) {
  if (!v) return "";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "" : d.toLocaleString();
}

function iconFor(item) {
  if (item.is_dir) return "📁";
  const n = (item.name || "").toLowerCase();
  const e = n.includes(".") ? n.split(".").pop() : "";
  if (["png","jpg","jpeg","gif","webp","svg","bmp","ico"].includes(e)) return "🖼️";
  if (["mp4","mkv","mov","avi","webm","m4v"].includes(e)) return "🎬";
  if (["mp3","wav","m4a","aac","flac","ogg"].includes(e)) return "🎵";
  if (["zip","7z","rar","tar","gz","tgz","bz2","xz"].includes(e)) return "📦";
  if (e === "pdf") return "📕";
  if (["json","xml","yaml","yml","csv"].includes(e)) return "🧾";
  if (["sh","py","js","ts","html","css","ps1","bat","cmd"].includes(e)) return "🧩";
  if (["doc","docx","odt"].includes(e)) return "📝";
  if (["xls","xlsx","ods"].includes(e)) return "📊";
  if (["ppt","pptx","odp"].includes(e)) return "📽️";
  return "📄";
}

function normalizedItems(items) {
  return items.map(item => ({
    ...item,
    name: item.is_dir ? cleanDirName(item.name) : String(item.name || "")
  }));
}

function sortItems(items) {
  return [...items].sort((a,b) => {
    if (Boolean(a.is_dir) !== Boolean(b.is_dir)) return a.is_dir ? -1 : 1;
    return String(a.name).localeCompare(String(b.name), undefined, {
      numeric:true, sensitivity:"base"
    });
  });
}

function renderBreadcrumbs() {
  breadcrumbs.replaceChildren();

  const root = document.createElement("button");
  root.className = "crumb";
  root.type = "button";
  root.textContent = "🏠 Public Downloads";
  root.addEventListener("click", () => navigateTo([]));
  breadcrumbs.append(root);

  state.path.forEach((part, i) => {
    const sep = document.createElement("span");
    sep.className = "sep";
    sep.textContent = "›";
    breadcrumbs.append(sep);

    const b = document.createElement("button");
    b.className = "crumb";
    b.type = "button";
    b.textContent = part;
    b.addEventListener("click", () => navigateTo(state.path.slice(0, i + 1)));
    breadcrumbs.append(b);
  });

  backBtn.disabled = state.path.length === 0;
}

function render() {
  renderBreadcrumbs();

  const q = search.value.trim().toLowerCase();
  const visible = sortItems(state.items).filter(item =>
    !q || String(item.name || "").toLowerCase().includes(q)
  );

  if (!visible.length) {
    main.className = "empty";
    main.textContent = q ? "No matching files or folders." : "This folder is empty.";
    updateViewButton();
    return;
  }

  main.className = "grid" + (state.view === "list" ? " list" : "");
  main.replaceChildren();

  visible.forEach(item => {
    const card = document.createElement("div");
    card.className = "item" + (item.is_dir ? " folder" : "");

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = iconFor(item);

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.name || "(unnamed)";
    name.title = item.name || "";

    const size = document.createElement("div");
    size.className = "sub size";
    size.textContent = item.is_dir ? "Folder" : formatBytes(item.size);

    const modified = document.createElement("div");
    modified.className = "sub modified";
    modified.textContent = formatDate(item.mod_time);

    const actions = document.createElement("div");
    actions.className = "actions";

    card.append(icon, name, size, modified);

    if (item.is_dir) {
      const folderName = cleanDirName(item.name);

      const openBtn = document.createElement("button");
      openBtn.className = "action secondary";
      openBtn.type = "button";
      openBtn.textContent = "Open";
      openBtn.addEventListener("click", e => {
        e.stopPropagation();
        openFolder(folderName);
      });

      const downloadBtn = document.createElement("a");
      downloadBtn.className = "action";
      downloadBtn.href = folderDownloadUrl(folderName);
      downloadBtn.textContent = "ZIP";
      downloadBtn.title = "Download complete folder as ZIP";
      downloadBtn.rel = "noopener";
      downloadBtn.addEventListener("click", e => e.stopPropagation());

      actions.append(openBtn, downloadBtn);
      card.append(actions);

      card.title = "Open folder";
      card.addEventListener("click", () => openFolder(folderName));

    } else {
      const openBtn = document.createElement("a");
      openBtn.className = "action secondary";
      openBtn.href = fileOpenUrl(item.name);
      openBtn.textContent = "Open";
      openBtn.target = "_blank";
      openBtn.rel = "noopener";
      openBtn.addEventListener("click", e => e.stopPropagation());

      const downloadBtn = document.createElement("a");
      downloadBtn.className = "action";
      downloadBtn.href = fileDownloadUrl(item.name);
      downloadBtn.textContent = "↓";
      downloadBtn.title = "Download file";
      downloadBtn.rel = "noopener";
      downloadBtn.addEventListener("click", e => e.stopPropagation());

      actions.append(openBtn, downloadBtn);
      card.append(actions);
    }

    main.append(card);
  });

  updateViewButton();
}

function updateViewButton() {
  viewBtn.textContent = state.view === "grid" ? "☷ List" : "▦ Grid";
}

function openFolder(folderName) {
  state.path.push(cleanDirName(folderName));
  search.value = "";
  load();
}

async function load(silent = false) {
  if (state.loading) return;
  state.loading = true;

  if (!silent) {
    main.className = "loading";
    main.textContent = "Loading files…";
  }

  renderBreadcrumbs();

  try {
    const res = await fetch(currentApiUrl(), {
      method: "GET",
      headers: { "Accept": "application/json" },
      cache: "no-store"
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("Unexpected directory response");

    state.items = normalizedItems(data);
    render();

  } catch (err) {
    if (!silent) {
      main.className = "error";
      main.textContent =
        "Could not load this folder: " +
        (err && err.message ? err.message : String(err));
    }
  } finally {
    state.loading = false;
  }
}

function navigateTo(parts) {
  state.path = parts.map(cleanDirName).filter(Boolean);
  search.value = "";
  load();
}

backBtn.addEventListener("click", () => {
  if (!state.path.length) return;
  state.path.pop();
  search.value = "";
  load();
});

refreshBtn.addEventListener("click", () => load());
search.addEventListener("input", render);

viewBtn.addEventListener("click", () => {
  state.view = state.view === "grid" ? "list" : "grid";
  localStorage.setItem("cybersabil-download-view", state.view);
  render();
});

setInterval(() => load(true), 20000);
load();
})();
</script>
</body>
